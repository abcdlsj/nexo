name: release

# Tag a commit (git tag v0.2.0 && git push origin v0.2.0) to publish Linux
# binaries, checksums and a versioned image. Hosts that run the binary read
# these with scripts/nexo-upgrade.sh; Docker hosts can pin nexo:<tag>.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - run: go test ./...

      - name: build archives
        env:
          TAG: ${{ steps.v.outputs.tag }}
          COMMIT: ${{ steps.v.outputs.commit }}
          DATE: ${{ steps.v.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            name="nexo_${TAG}_linux_${arch}"
            dir="dist/${name}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w \
                -X github.com/abcdlsj/nexo/internal/buildinfo.Version=${TAG} \
                -X github.com/abcdlsj/nexo/internal/buildinfo.Commit=${COMMIT} \
                -X github.com/abcdlsj/nexo/internal/buildinfo.Date=${DATE}" \
              -o "${dir}/nexo" .
            cp example/config.yaml "$dir/"
            cp README.md "$dir/"
            tar -czf "dist/${name}.tar.gz" -C "$dir" .
            rm -rf "$dir"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt && cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz
          retention-days: 2

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            COMMIT=${{ steps.v.outputs.commit }}
            BUILD_DATE=${{ steps.v.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
