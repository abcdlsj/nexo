# Nexo Configuration Example

# Basic settings
email: your-email@example.com
staging: false                    # Set to true to use Let's Encrypt staging environment
base_dir: /etc/nexo               # Base directory for nexo data
cert_dir: /etc/nexo/certs         # Certificate storage directory
# response_header_timeout: 300s   # Global default for upstream header wait; "0" waits indefinitely
# max_request_body: 10MB          # Global request body cap; accepts KB/MB/GB or a raw byte count
# read_timeout: 30s               # Global cap for reading a request (headers plus body)

# Cloudflare DNS API configuration (required for DNS-01 challenge)
cloudflare:
  api_token: your-cloudflare-api-token

# Wildcard domains (will obtain *.example.com certificate)
wildcards:
  - "*.example.com"
  - "*.yourdomain.com"

# WebUI configuration
webui:
  host: 127.0.0.1                # Loopback by default; use 0.0.0.0 only behind a trusted HTTPS gateway
  port: "8080"                    # WebUI listen port
  username: admin                 # Login username
  password: "$2a$10$xxxxx..."     # Bcrypt hashed password (generate with: make password PASSWORD=xxx)

# GitHub OAuth authentication (optional)
auth:
  auth_host: auth.example.com     # Unified callback domain for OAuth
  secret_key: ""                  # Auto-generated if empty
  session_ttl: "24h"              # Session TTL
  github:
    client_id: your-github-client-id
    client_secret: your-github-client-secret
    allowed_users:
      - your-github-username
      - another-allowed-user

# Control plane (optional). Disabled by default and never changes routing.
# Enable on every node to let one node aggregate the fleet. Tokens are separate
# for read and write; a non-loopback listener refuses to start without a token.
# control_plane:
#   enabled: true
#   listen: 127.0.0.1:9090          # use a tailnet/VPN address for remote peers
#   node:
#     id: ""                        # generated once into base_dir/node-id
#     name: nexo-main-01
#     labels:
#       region: eu
#   auth:
#     token_file: /etc/nexo/control-token        # read:control
#     write_token_file: /etc/nexo/control-write  # write:routes/certs/security
#   coordinator:
#     enabled: true
#     poll_interval: 10s
#     request_timeout: 3s
#     stale_after: 30s
#     peers:
#       - id: nexo-hk-01
#         url: http://10.0.0.12:9090
#         token_file: /etc/nexo/peers/nexo-hk-01.read
#         write_token_file: /etc/nexo/peers/nexo-hk-01.write
#   topology:
#     links:                          # explicit cross-node links for the fleet graph
#       - id: api-to-internal
#         from: {node_id: nexo-main-01, route_id: api.example.com}
#         to: {node_id: nexo-hk-01, route_id: internal.example.com}
#         relation: forwards

# Proxy configurations
proxies:
  # Blog service (protected by OAuth)
  blog.example.com:
    upstream: http://localhost:3000
    auth: true
    # auth_exclude:                   # paths that stay public (PWA assets, health checks)
    #   - /manifest.webmanifest
    #   - /icon-*.png
    portal:
      name: Blog
      description: Writing and publishing
      icon: auto                    # Discovers the icon from the configured upstream
      kind: website                 # Optional: website, api, or service
      group: workspace
      order: 10
      hidden: false

  # Public API service
  api.example.com:
    upstream: http://localhost:8080
    auth: false
    # response_header_timeout: "30s"  # wait for upstream response headers; "0" waits indefinitely
    # write_timeout: "2m"             # total response write cap; empty/"0" disables
    # retry: true                     # retry once before response starts, idempotent methods only

  # Tunnel route in front of gnar: allow slow first headers and pass upstream
  # response headers through without Nexo's automatic Cache-Control injection.
  tunnel.example.com:
    upstream: http://localhost:8081
    response_header_timeout: 300s
    cache: false

  # Main website
  www.example.com:
    upstream: http://localhost:8000

  # Redirect example
  old.example.com:
    redirect: https://www.example.com
    # Redirects are omitted from the gateway directory unless portal is set.

  # Standalone domain (not in wildcards, will obtain individual certificate)
  specific.otherdomain.com:
    upstream: http://localhost:5000
    auth: true

# Docker label discovery (optional)
# Containers carrying nexo.* labels become routes without an entry above.
docker:
  enabled: false
  socket: /var/run/docker.sock    # Docker daemon socket
  host: 127.0.0.1                 # prefix for upstreams reached through published host ports
# Example:
#   docker run -d --name api \
#     --label nexo.domain=api.example.com \
#     --label nexo.port=8080 \
#     --label nexo.network=my-network \
#     my-api:latest
