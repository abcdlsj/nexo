{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Nexo - Proxy Control Plane</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --canvas: #f1f3f2;
      --paper: #fffefb;
      --ink: #151716;
      --ink-soft: #555c59;
      --line: #151716;
      --line-soft: #b7bdb9;
      --wash: #e4e8e5;
      --blue: #4c78ff;
      --blue-soft: #dce5ff;
      --yellow: #f8df54;
      --yellow-soft: #fff5bd;
      --coral: #ff6f61;
      --coral-soft: #ffe0dc;
      --green: #65d28a;
      --green-soft: #dff7e7;
      --background: var(--canvas);
      --foreground: var(--ink);
      --card: var(--paper);
      --card-foreground: var(--ink);
      --muted: var(--wash);
      --muted-foreground: var(--ink-soft);
      --border: var(--line);
      --input: var(--line);
      --primary: var(--blue);
      --primary-foreground: #fff;
      --secondary: var(--yellow);
      --secondary-foreground: var(--ink);
      --accent: var(--blue-soft);
      --accent-foreground: var(--ink);
      --destructive: var(--coral);
      --destructive-foreground: var(--ink);
      --success: var(--green);
      --success-foreground: var(--ink);
      --warning: var(--yellow);
      --warning-foreground: var(--ink);
      --ring: var(--blue);
      --text-muted: var(--ink-soft);
      --primary-color: var(--blue);
      --shadow: 3px 3px 0 var(--line);
      --shadow-sm: 2px 2px 0 var(--line);
      --radius: 4px;
      --display-font: "Avenir Next Condensed", "Franklin Gothic Medium", sans-serif;
      --body-font: "Avenir Next", "Trebuchet MS", sans-serif;
      --mono-font: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    [data-theme="dark"] {
      --canvas: #181a19;
      --paper: #232624;
      --ink: #f4f5f2;
      --ink-soft: #b7bdb9;
      --line: #f4f5f2;
      --line-soft: #555b58;
      --wash: #303431;
      --blue: #7698ff;
      --blue-soft: #29375f;
      --yellow: #f8df54;
      --yellow-soft: #554c22;
      --coral: #ff8075;
      --coral-soft: #57302d;
      --green: #75df98;
      --green-soft: #244a31;
      --primary-foreground: #111;
      --shadow: 3px 3px 0 #f4f5f2;
      --shadow-sm: 2px 2px 0 #f4f5f2;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --canvas: #181a19;
        --paper: #232624;
        --ink: #f4f5f2;
        --ink-soft: #b7bdb9;
        --line: #f4f5f2;
        --line-soft: #555b58;
        --wash: #303431;
        --blue: #7698ff;
        --blue-soft: #29375f;
        --yellow: #f8df54;
        --yellow-soft: #554c22;
        --coral: #ff8075;
        --coral-soft: #57302d;
        --green: #75df98;
        --green-soft: #244a31;
        --primary-foreground: #111;
        --shadow: 3px 3px 0 #f4f5f2;
        --shadow-sm: 2px 2px 0 #f4f5f2;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--foreground);
      background: var(--background);
      font-family: var(--body-font);
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0;
    }
    body::before {
      content: "";
      display: block;
      height: 5px;
      background: linear-gradient(90deg, var(--blue) 0 48%, var(--yellow) 48% 76%, var(--coral) 76%);
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    ::selection { color: #111; background: var(--yellow); }

    h1, h2, h3, h4, h5, h6 {
      margin: 0;
      font-family: var(--display-font);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: 0;
    }
    h1 { font-size: 2.5rem; }
    h2 { font-size: 1.45rem; }
    h3 { font-size: 1.1rem; }
    p { margin: 0; }
    code, .proxy-target, .current-ip { font-family: var(--mono-font); }
    code { padding: .1rem .3rem; border: 1px solid var(--border); border-radius: 2px; background: var(--yellow-soft); }

    .container { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding-bottom: 3.5rem; }
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      margin-bottom: 2.25rem;
      border-bottom: 2px solid var(--border);
      background: var(--card);
    }
    .navbar-inner {
      width: min(1120px, calc(100% - 2rem));
      min-height: 62px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    .navbar-brand {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: .5rem;
      padding: .36rem .58rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--primary-foreground);
      box-shadow: var(--shadow-sm);
      font-family: var(--display-font);
      font-size: 1rem;
      font-weight: 900;
      text-decoration: none !important;
    }
    .navbar-brand svg { width: 18px; height: 18px; }
    .nexo-mark .mark-flow { stroke-width: 1.5; }
    .nexo-mark .mark-core { fill: var(--blue); stroke-width: 1.25; }
    .nexo-mark .mark-upstream-a, .nexo-mark .mark-upstream-b { stroke-width: 1.25; }
    .nexo-mark .mark-upstream-a { fill: var(--yellow); }
    .nexo-mark .mark-upstream-b { fill: var(--coral); }
    .navbar-meta { display: flex; flex: none; align-items: center; gap: .45rem; }
    .current-ip, .demo-badge {
      max-width: 150px;
      overflow: hidden;
      padding: .22rem .45rem;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      font-family: var(--mono-font);
      font-size: .68rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .current-ip { background: var(--blue-soft); }
    .demo-badge { background: var(--yellow); color: #111; text-transform: uppercase; }
    .navbar-nav { min-width: 0; margin-left: auto; display: flex; align-items: center; gap: .1rem; }
    .navbar-nav > a, .theme-toggle, .logout-button {
      display: inline-flex;
      min-height: 36px;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .42rem .52rem;
      border: 1.5px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--foreground);
      font-size: .74rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .navbar-nav > a:hover, .theme-toggle:hover, .logout-button:hover { border-color: var(--border); background: var(--yellow-soft); text-decoration: none; }
    .navbar-nav > a.active { border-color: var(--border); background: var(--yellow); color: #111; box-shadow: 2px 2px 0 var(--border); }
    .navbar-nav form { margin: 0; }
    .theme-toggle, .logout-button { width: 36px; padding: .4rem; }
    .theme-toggle .sun-icon { display: none; }
    .theme-toggle .moon-icon { display: block; }
    [data-theme="dark"] .theme-toggle .sun-icon { display: block; }
    [data-theme="dark"] .theme-toggle .moon-icon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .theme-toggle .sun-icon { display: block; }
      :root:not([data-theme]) .theme-toggle .moon-icon { display: none; }
    }

    .page-intro { display: flex; align-items: end; justify-content: space-between; gap: 1.5rem; margin-bottom: 1.6rem; }
    .eyebrow {
      width: max-content;
      margin-bottom: .45rem;
      padding: .12rem .4rem;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      background: var(--yellow);
      color: #111;
      font-family: var(--mono-font);
      font-size: .65rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .lede { max-width: 64ch; margin-top: .45rem; color: var(--muted-foreground); font-size: .92rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .75rem; }

    .card, .stat-card, .proxy-item {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--card-foreground);
    }
    .card { padding: 1.15rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .9rem; padding-bottom: .7rem; border-bottom: 1.5px solid var(--border); }
    .card-title { font-size: 1.1rem; }
    .card-subtitle { display: block; margin-top: .12rem; color: var(--muted-foreground); font-size: .8rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; margin-bottom: 2.25rem; }
    .stat-card { position: relative; min-height: 104px; padding: .85rem 1rem; border-top-width: 5px; overflow: hidden; }
    .stat-card:nth-child(1) { border-top-color: var(--blue); }
    .stat-card:nth-child(2) { border-top-color: var(--green); }
    .stat-card:nth-child(3) { border-top-color: var(--yellow); }
    .stat-card:nth-child(4) { border-top-color: var(--coral); }
    .stat-card::after { content: ""; position: absolute; right: .75rem; top: .8rem; width: 9px; height: 9px; border: 1.5px solid var(--border); background: var(--wash); }
    .stat-label { padding-right: 1.2rem; color: var(--muted-foreground); font-family: var(--mono-font); font-size: .68rem; font-weight: 700; text-transform: uppercase; }
    .stat-value { margin-top: .55rem; color: inherit !important; font-family: var(--display-font); font-size: 2.25rem; font-weight: 900; line-height: 1; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .proxy-list { display: grid; gap: .55rem; }
    .dashboard-list .proxy-item:nth-child(n+6) { display: none; }
    .proxy-item { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: .9rem; padding: .75rem .85rem; transition: background-color .12s ease, transform .12s ease; }
    .proxy-item:hover { background: color-mix(in srgb, var(--blue-soft) 40%, var(--card)); transform: translateX(2px); }
    .proxy-info { min-width: 0; flex: 1; }
    .proxy-domain { display: flex; min-width: 0; align-items: center; flex-wrap: wrap; gap: .4rem; font-family: var(--display-font); font-size: 1rem; font-weight: 800; overflow-wrap: anywhere; }
    .proxy-target { margin-top: .22rem; color: var(--muted-foreground); font-size: .75rem; overflow-wrap: anywhere; }
    .proxy-actions { display: flex; flex: none; align-items: center; gap: .4rem; }
    .proxy-type-badge, .cert-status, .badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      padding: .12rem .34rem;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      background: var(--blue-soft);
      color: var(--foreground);
      font-family: var(--mono-font);
      font-size: .61rem;
      font-weight: 800;
      line-height: 1.3;
      text-transform: uppercase;
    }
    .proxy-type-badge.redirect { background: var(--yellow-soft); }
    .proxy-type-badge.auth { background: var(--coral-soft); }
    .cert-status.valid, .badge-https { background: var(--green-soft); }
    .cert-status.expiring, .badge-http { background: var(--yellow-soft); }
    .cert-status.error { background: var(--coral-soft); }
    .cert-wildcard { border-left: 5px solid var(--blue); }
    .cert-wildcard-child { border-left: 5px solid var(--line-soft); background: color-mix(in srgb, var(--wash) 65%, var(--card)); }

    .btn {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .45rem .72rem;
      border: 2px solid var(--border) !important;
      border-radius: var(--radius);
      background: var(--secondary);
      color: var(--secondary-foreground);
      font-size: .78rem;
      font-weight: 800;
      text-decoration: none !important;
      cursor: pointer;
      transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
    }
    .btn:hover { box-shadow: var(--shadow-sm); transform: translate(-1px, -1px); }
    .btn:active { box-shadow: none; transform: translate(1px, 1px); }
    .btn-primary { background: var(--primary) !important; color: var(--primary-foreground) !important; box-shadow: var(--shadow-sm); }
    .btn-secondary { background: var(--yellow) !important; color: #111 !important; }
    .btn-danger { background: var(--destructive) !important; color: var(--destructive-foreground) !important; }
    .btn-success { background: var(--success) !important; color: var(--success-foreground) !important; }
    .btn-ghost { background: var(--card) !important; color: var(--foreground) !important; }
    .btn-sm { min-height: 32px; padding: .3rem .52rem; font-size: .7rem; }
    .btn-icon { width: 36px; padding: .38rem; }

    .form-container { display: flex; align-items: end; flex-wrap: wrap; gap: .65rem; }
    .form-group { display: flex; min-width: 0; flex-direction: column; gap: .3rem; margin-bottom: .85rem; }
    .form-group label, .field-label { font-family: var(--mono-font); font-size: .68rem; font-weight: 800; text-transform: uppercase; }
    input[type="text"], input[type="url"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
      min-height: 42px;
      padding: .52rem .65rem;
      border: 2px solid var(--input);
      border-radius: var(--radius);
      outline: none;
      background: var(--card);
      color: var(--foreground);
    }
    textarea { min-height: 150px; resize: vertical; font-family: var(--mono-font); font-size: .76rem; }
    input:focus, select:focus, textarea:focus { background: var(--blue-soft); box-shadow: var(--shadow-sm); }
    input[readonly] { border-color: var(--line-soft); background: var(--muted) !important; color: var(--muted-foreground); }
    input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--blue); }
    input[type="hidden"] { display: none; }
    .switch-row { display: flex !important; align-items: center; gap: .55rem; width: max-content; cursor: pointer; text-transform: none !important; }
    .segmented { display: inline-grid; grid-template-columns: repeat(2, 1fr); padding: 3px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--wash); }
    .segmented label { position: relative; min-width: 90px; padding: .42rem .7rem; border-radius: 2px; text-align: center; cursor: pointer; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label:has(input:checked) { background: var(--yellow); color: #111; box-shadow: 1px 1px 0 var(--border); }
    .route-composer { margin-bottom: 1.25rem; padding: 0; overflow: hidden; }
    .route-composer > summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1rem; background: var(--paper); cursor: pointer; list-style: none; }
    .route-composer > summary::-webkit-details-marker { display: none; }
    .route-composer > summary::after { content: "+"; display: grid; width: 28px; height: 28px; place-items: center; border: 2px solid var(--border); border-radius: 2px; background: var(--blue); color: #fff; font-size: 1.2rem; font-weight: 900; }
    .route-composer[open] > summary { border-bottom: 2px solid var(--border); background: var(--yellow-soft); }
    .route-composer[open] > summary::after { content: "-"; }
    .composer-body { padding: 1rem; }
    .composer-grid { display: grid; grid-template-columns: minmax(180px, .8fr) minmax(280px, 1.4fr); gap: 1rem; align-items: start; }
    .composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .25rem; padding-top: .85rem; border-top: 1.5px solid var(--line-soft); }

    .empty-state { display: flex; min-height: 180px; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; }
    .empty-state-icon { width: 42px; height: 42px; margin-bottom: .75rem; }
    .empty-state-title { font-family: var(--display-font); font-size: 1.25rem; font-weight: 800; }
    .error-code { color: var(--primary); font-family: var(--display-font); font-size: 7rem; font-weight: 900; line-height: .85; -webkit-text-stroke: 2px var(--border); }

    .icon { width: 16px; height: 16px; flex: none; }
    .icon-sm { width: 14px; height: 14px; flex: none; }
    .text-muted { color: var(--muted-foreground); }
    .text-sm { font-size: .82rem; }
    .text-xs { font-size: .7rem; }
    .font-medium { font-weight: 700; }
    .font-semibold { font-weight: 800; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: .5rem; }
    .gap-4 { gap: 1rem; }
    .mb-4 { margin-bottom: 1.25rem; }
    .mt-4 { margin-top: 1rem; }
    .table-scroll { overflow-x: auto; border: 2px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; background: var(--card); font-size: .82rem; }
    th, td { padding: .62rem .7rem; border-bottom: 1px solid var(--line-soft); text-align: left; white-space: nowrap; }
    th { background: var(--yellow-soft); color: var(--foreground); font-family: var(--mono-font); font-size: .63rem; text-transform: uppercase; }
    tbody tr:hover { background: var(--blue-soft); }
    tbody tr:last-child td { border-bottom: 0; }
    #requestsTable td:nth-child(4) { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }

    .logs-container { max-height: 400px; overflow: auto; padding: .8rem; border: 2px solid var(--border); border-radius: var(--radius); background: #111; color: #eaf7dd; font-family: var(--mono-font); font-size: .75rem; }
    .log-entry { padding: .25rem 0; border-bottom: 1px dashed #666; }
    .log-time { color: #aaa; }
    .log-level-info { color: #7ea2ff; }
    .log-level-error { color: #ff8075; }
    .log-level-warn { color: #f8df54; }
    .config-yaml { margin: 0; border: 2px solid var(--border); border-radius: var(--radius); background: #171918 !important; color: #eff5f0; }
    .config-yaml code { padding: 0; border: 0; background: transparent; color: inherit; }
    .refresh-indicator { padding: .35rem .55rem; border: 1.5px solid var(--border); border-radius: 2px; background: var(--green-soft); color: var(--foreground); font-family: var(--mono-font); }
    .traffic-refresh { display: flex; align-items: center; gap: .5rem; }
    .toast-container { position: fixed; top: 4.5rem; right: 1rem; z-index: 100; display: grid; gap: .5rem; pointer-events: none; }
    .toast { max-width: min(360px, calc(100vw - 2rem)); padding: .7rem .85rem; border: 2px solid #111; border-radius: var(--radius); box-shadow: 3px 3px 0 #111; color: #111; font-weight: 800; animation: toast-in .18s ease-out, toast-out .2s ease-in 3.7s forwards; }
    .toast-success { background: #75df98; }
    .toast-error { background: #ff8075; }
    @keyframes toast-in { from { opacity: 0; transform: translate(8px, -5px); } }
    @keyframes toast-out { to { opacity: 0; transform: translateX(8px); } }

    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    @media (max-width: 940px) {
      .navbar-meta { display: none; }
      .navbar-inner { align-items: stretch; flex-wrap: wrap; padding: .55rem 0 0; }
      .navbar-brand { align-self: center; }
      .navbar-nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; padding-bottom: .5rem; scrollbar-width: thin; }
      .navbar-nav > a { flex: 1 0 auto; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2, .composer-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 580px) {
      .container, .navbar-inner { width: min(100% - 1rem, 1120px); }
      .navbar { margin-bottom: 1.5rem; }
      .navbar-inner { gap: .35rem; }
      .navbar-brand { margin-right: auto; }
      .navbar-nav > a { gap: .28rem; padding-inline: .45rem; }
      .page-intro { align-items: flex-start; flex-direction: column; margin-bottom: 1.25rem; }
      .page-intro .btn { width: 100%; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.3rem; }
      .stats-grid { gap: .5rem; }
      .stat-card { min-height: 92px; padding: .72rem; }
      .stat-value { font-size: 1.85rem; }
      .proxy-item { align-items: flex-start; }
      .proxy-actions { align-self: center; }
      .cert-wildcard-child .proxy-info { padding-left: .4rem !important; }
      .composer-actions { align-items: stretch; flex-direction: column; }
      .composer-actions .btn { width: 100%; }
      .form-container { align-items: stretch; flex-direction: column; }
      .form-container input, .form-container .btn { width: 100%; min-width: 0 !important; }
      .card { padding: .9rem; }
    }
    /* Nexo switchboard */
    :root {
      --canvas: #f8f8f6;
      --paper: #ffffff;
      --ink: #202326;
      --ink-soft: #737b81;
      --line: #202326;
      --line-soft: #d2d5d6;
      --wash: #f0f1ef;
      --blue: #0076c8;
      --blue-soft: #e4f2fb;
      --yellow: #eef0ed;
      --yellow-soft: #f5f6f3;
      --coral: #c84b55;
      --coral-soft: #f9e5e7;
      --green: #187653;
      --green-soft: #def2e9;
      --shadow: none;
      --shadow-sm: none;
      --radius: 2px;
      --display-font: Avenir, "Avenir Next", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --body-font: var(--display-font);
    }
    [data-theme="dark"] {
      --canvas: #202b38;
      --paper: #18232d;
      --ink: #f2f5f7;
      --ink-soft: #9eabb6;
      --line: #f2f5f7;
      --line-soft: #40566a;
      --wash: #243342;
      --blue: #52b5f5;
      --blue-soft: #163e59;
      --yellow: #293744;
      --yellow-soft: #24313d;
      --coral: #ff7d87;
      --coral-soft: #4e2d35;
      --green: #63d3a2;
      --green-soft: #183e33;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --canvas: #202b38;
        --paper: #18232d;
        --ink: #f2f5f7;
        --ink-soft: #9eabb6;
        --line: #f2f5f7;
        --line-soft: #40566a;
        --wash: #243342;
        --blue: #52b5f5;
        --blue-soft: #163e59;
        --yellow: #293744;
        --yellow-soft: #24313d;
        --coral: #ff7d87;
        --coral-soft: #4e2d35;
        --green: #63d3a2;
        --green-soft: #183e33;
      }
    }
    body::before { display: none; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--display-font); }
    h1 { font-size: 1.45rem; }
    h2 { font-size: 1.1rem; }
    h3 { font-size: .95rem; }

    body.app-page { width: 100%; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    .app-page .navbar { position: static; margin: 0; border: 0; background: transparent; }
    .app-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 60; width: 192px; display: flex; flex-direction: column; border-right: 1px solid var(--line-soft); background: var(--paper); }
    .app-brand { height: 58px; display: flex; flex: none; align-items: center; gap: 10px; padding: 0 17px; border-bottom: 1px solid var(--line-soft); color: var(--ink); text-decoration: none !important; }
    .app-brand .nexo-mark { width: 24px; height: 24px; }
    .app-brand .mark-core { fill: var(--ink); }
    .app-brand .mark-upstream-a, .app-brand .mark-upstream-b { fill: var(--paper); }
    .app-brand b { display: block; font-size: 17px; letter-spacing: -.045em; }
    .app-brand small { display: block; margin-top: -2px; color: var(--ink-soft); font: 8px/1 var(--mono-font); letter-spacing: .12em; text-transform: uppercase; }
    .app-nav { display: grid; margin-top: 18px; }
    .app-nav a { min-height: 40px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 17px 0 15px; border-left: 2px solid transparent; color: var(--ink-soft); font-size: 12px; font-weight: 650; text-decoration: none; }
    .app-nav a:hover { background: var(--wash); color: var(--ink); text-decoration: none; }
    .app-nav a.active { border-left-color: var(--blue); background: var(--blue-soft); color: var(--ink); }
    .app-nav small { color: var(--ink-soft); font: 8px/1 var(--mono-font); }
    .core-readout { margin-top: auto; border-top: 1px solid var(--line-soft); }
    .core-head { min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 17px; border-bottom: 1px solid var(--line-soft); font: 9px/1 var(--mono-font); letter-spacing: .08em; }
    .core-head b { margin-left: auto; color: var(--green); font-weight: 600; }
    .status-led { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .core-readout dl { display: grid; grid-template-columns: 1fr 1fr; margin: 0; }
    .core-readout dl div { min-width: 0; padding: 10px 8px 10px 17px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
    .core-readout dl div:nth-child(even) { border-right: 0; }
    .core-readout dl div:nth-last-child(-n + 2) { border-bottom: 0; }
    .core-readout dt { color: var(--ink-soft); font: 7px/1 var(--mono-font); letter-spacing: .08em; }
    .core-readout dd { margin: 5px 0 0; overflow: hidden; color: var(--ink); font: 9px/1 var(--mono-font); text-overflow: ellipsis; white-space: nowrap; }

    .app-topbar { position: fixed; top: 0; right: 0; left: 192px; z-index: 50; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 clamp(18px, 3vw, 34px); border-bottom: 1px solid var(--line-soft); background: var(--canvas); }
    .app-location { margin-right: auto; color: var(--ink); font: 9px/1 var(--mono-font); letter-spacing: .1em; white-space: nowrap; }
    .app-location span { color: var(--ink-soft); }
    .gateway-search { position: relative; width: min(270px, 30vw); }
    .gateway-search svg { position: absolute; top: 50%; left: 1px; width: 14px; height: 14px; color: var(--ink-soft); transform: translateY(-50%); pointer-events: none; }
    .gateway-search input { width: 100%; min-height: 32px; padding: 0 27px 0 21px; border: 0; border-bottom: 1px solid var(--line-soft); border-radius: 0; background: transparent; box-shadow: none; font-size: 11px; }
    .gateway-search input:focus { border-bottom-color: var(--blue); background: transparent; box-shadow: none; }
    .gateway-search kbd { position: absolute; top: 10px; right: 2px; color: var(--ink-soft); font: 8px/1 var(--mono-font); }
    .topbar-action, .theme-toggle, .logout-button { height: 32px; display: inline-flex; flex: none; align-items: center; justify-content: center; border: 1px solid var(--line-soft); border-radius: 2px; background: var(--paper); color: var(--ink); }
    .topbar-action { gap: 6px; padding: 0 10px; font: 9px/1 var(--mono-font); letter-spacing: .06em; text-decoration: none !important; }
    .topbar-action:hover, .theme-toggle:hover, .logout-button:hover { border-color: var(--blue); background: var(--paper); color: var(--blue); }
    .theme-toggle, .logout-button { width: 32px; min-height: 32px; padding: 0; }
    .app-topbar form { margin: 0; }
    .app-topbar .demo-badge { border: 1px solid var(--line-soft); background: var(--paper); color: var(--ink-soft); }

    .app-page .container { position: fixed; top: 58px; right: 0; bottom: 0; left: 192px; width: auto; max-width: none; margin: 0; padding: 26px clamp(22px, 3.2vw, 46px) 48px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .page-intro { min-height: 50px; align-items: center; margin: 0 0 18px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
    .page-intro .eyebrow { margin: 0 0 4px; padding: 0; border: 0; background: transparent; color: var(--blue); font: 8px/1 var(--mono-font); letter-spacing: .1em; }
    .page-intro .lede { margin-top: 3px; color: var(--ink-soft); font-size: 11px; }
    .card, .stat-card, .proxy-item, .table-scroll { border: 1px solid var(--line-soft); border-radius: 2px; background: var(--paper); box-shadow: none; }
    .card-header { border-bottom-color: var(--line-soft); }
    .stats-grid { gap: 0; border: 1px solid var(--line-soft); background: var(--paper); }
    .stat-card { min-height: 78px; border: 0; border-right: 1px solid var(--line-soft); border-radius: 0; }
    .stat-card:last-child { border-right: 0; }
    .stat-card:nth-child(n) { border-top: 0; }
    .stat-card::after { display: none; }
    .stat-label { font-size: 8px; }
    .stat-value { margin-top: .4rem; font-family: var(--mono-font); font-size: 1.45rem; font-weight: 600; }
    .proxy-list { gap: 0; border-top: 1px solid var(--line-soft); }
    .proxy-item { border-top: 0; border-color: var(--line-soft); border-radius: 0; }
    .proxy-item:hover { background: var(--blue-soft); transform: none; }
    .proxy-type-badge, .cert-status, .badge { border: 1px solid var(--line-soft); background: var(--wash); }
    .btn { min-height: 34px; border: 1px solid var(--line-soft) !important; border-radius: 2px; background: var(--paper); box-shadow: none !important; font-family: var(--mono-font); font-size: .68rem; letter-spacing: .03em; }
    .btn:hover, .btn:active { border-color: var(--blue) !important; box-shadow: none; transform: none; }
    .btn-primary { border-color: var(--blue) !important; background: var(--blue) !important; color: #fff !important; }
    .btn-secondary, .btn-ghost { background: var(--paper) !important; color: var(--ink) !important; }
    input[type="text"], input[type="url"], input[type="email"], input[type="password"], input[type="number"], select, textarea { border: 1px solid var(--line-soft); border-radius: 2px; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); background: var(--paper); box-shadow: none; }
    .segmented { border: 1px solid var(--line-soft); border-radius: 2px; }
    .segmented label:has(input:checked) { background: var(--ink); color: var(--canvas); box-shadow: none; }
    .route-composer > summary::after { border: 1px solid var(--line-soft); border-radius: 2px; }
    .route-composer[open] > summary, .route-composer[open] > summary::after { border-color: var(--line-soft); }
    .portal-options { margin: .9rem 0; padding: .9rem; border: 1px solid var(--line-soft); }
    .portal-options legend { padding: 0 .35rem; color: var(--ink-soft); font: 8px/1 var(--mono-font); letter-spacing: .08em; text-transform: uppercase; }
    .portal-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, .42fr); gap: .8rem; }
    .table-scroll { border-color: var(--line-soft); }
    th { background: var(--wash); }
    th, td { border-bottom-color: var(--line-soft); }
    .refresh-indicator { border: 1px solid var(--line-soft); background: var(--paper); }

    .gateway-dashboard { display: grid; grid-template-rows: minmax(255px, 1.08fr) minmax(205px, .92fr); gap: 14px; overflow: hidden !important; }
    .switchboard-panel, .directory-panel { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line-soft); background: var(--paper); }
    .board-header { min-height: 46px; display: flex; flex: none; align-items: stretch; border-bottom: 2px solid var(--ink); }
    .board-title { display: flex; align-items: center; gap: 13px; padding: 0 14px; }
    .board-title small { color: var(--blue); font: 8px/1 var(--mono-font); }
    .board-title h1, .board-title h2 { font-size: 12px; letter-spacing: .02em; }
    .board-readouts { display: flex; margin-left: auto; }
    .board-readouts span { min-width: 88px; display: grid; align-content: center; gap: 3px; padding: 0 12px; border-left: 1px solid var(--line-soft); }
    .board-readouts small { color: var(--ink-soft); font: 7px/1 var(--mono-font); letter-spacing: .08em; }
    .board-readouts b { font: 9px/1 var(--mono-font); font-weight: 500; }
    .topology-scroll, .directory-scroll { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .topology-scroll { background-color: var(--paper); background-image: linear-gradient(rgba(32,35,38,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(32,35,38,.06) 1px, transparent 1px); background-size: 20px 20px; }
    [data-theme="dark"] .topology-scroll { background-image: linear-gradient(rgba(215,221,226,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(215,221,226,.06) 1px, transparent 1px); }
    .topology-canvas { position: relative; min-width: 720px; min-height: 100%; display: grid; grid-template-columns: 170px 190px minmax(270px, 1fr); align-items: center; gap: 70px; padding: 26px 34px; }
    .topology-wires { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
    .topology-wire-base, .topology-wire-live { fill: none; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .topology-wire-base { stroke: var(--line-soft); }
    .topology-wire-live { stroke: var(--blue); stroke-dasharray: 2 9; animation: route-packet 1.5s linear infinite; }
    @keyframes route-packet { to { stroke-dashoffset: -22; } }
    .topology-node { position: relative; z-index: 2; min-width: 0; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 9px; min-height: 52px; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 2px; background: var(--paper); color: var(--ink); text-decoration: none; }
    .topology-node:hover { border-color: var(--blue); text-decoration: none; }
    .topology-node::before { content: ""; position: absolute; top: 50%; left: -5px; width: 7px; height: 7px; border: 1px solid var(--line-soft); border-radius: 50%; background: var(--paper); transform: translateY(-50%); }
    .edge-node::before { right: -5px; left: auto; }
    .core-node { min-height: 96px; grid-template-columns: 34px minmax(0, 1fr); border-color: var(--ink); background: var(--ink); color: var(--canvas); }
    .core-node::before { border-color: var(--blue); background: var(--blue); }
    .core-node::after { content: ""; position: absolute; top: 50%; right: -5px; width: 7px; height: 7px; border: 1px solid var(--blue); border-radius: 50%; background: var(--blue); transform: translateY(-50%); }
    .topology-services { position: relative; z-index: 2; display: grid; align-content: center; gap: 8px; padding: 12px 0; }
    .topology-icon, .gateway-icon { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-soft); background: var(--paper); color: var(--blue); font: 10px/1 var(--mono-font); }
    .core-node .topology-icon { border-color: color-mix(in srgb, var(--canvas) 35%, transparent); background: transparent; color: var(--canvas); }
    .topology-icon img, .gateway-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--paper); }
    .topology-icon > svg, .topology-icon .nexo-mark { width: 16px; height: 16px; }
    .topology-name { display: block; overflow: hidden; font-size: 11px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .topology-meta { display: block; margin-top: 3px; overflow: hidden; color: var(--ink-soft); font: 8px/1 var(--mono-font); text-overflow: ellipsis; white-space: nowrap; }
    .core-node .topology-name { color: var(--canvas); }
    .core-node .topology-meta { color: color-mix(in srgb, var(--canvas) 62%, transparent); line-height: 1.45; white-space: normal; }
    .topology-state { color: var(--ink-soft); font: 7px/1 var(--mono-font); }
    .topology-service[hidden] { display: none; }
    .node-dim { opacity: .16; }

    .directory-filters { display: flex; margin-left: auto; }
    .directory-filter { min-width: 76px; padding: 0 10px; border: 0; border-left: 1px solid var(--line-soft); background: transparent; color: var(--ink-soft); font: 8px/1 var(--mono-font); }
    .directory-filter.active { background: var(--ink); color: var(--canvas); }
    .gateway-route-row { min-height: 62px; display: grid; grid-template-columns: 42px 48px minmax(170px, 1.2fr) 86px 92px minmax(170px, .9fr) 42px; align-items: center; border-bottom: 1px solid var(--line-soft); color: inherit; text-decoration: none; }
    .gateway-route-row:hover { background: var(--blue-soft); text-decoration: none; }
    .gateway-route-row[hidden] { display: none; }
    .route-number { align-self: stretch; display: grid; place-items: center; border-right: 1px solid var(--line-soft); color: var(--ink-soft); font: 8px/1 var(--mono-font); }
    .gateway-icon { justify-self: center; }
    .gateway-copy { min-width: 0; padding: 0 10px; }
    .gateway-name { display: block; overflow: hidden; color: var(--ink); font-size: 11px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .gateway-description { display: block; margin-top: 3px; overflow: hidden; color: var(--ink-soft); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .route-kind, .route-policy { justify-self: start; padding: 4px 6px; border: 1px solid var(--line-soft); color: var(--ink-soft); font: 7px/1 var(--mono-font); }
    .route-policy.protected { color: var(--green); }
    .gateway-domain { min-width: 0; overflow: hidden; color: var(--blue); font: 9px/1 var(--mono-font); text-overflow: ellipsis; white-space: nowrap; }
    .gateway-open { align-self: stretch; display: grid; place-items: center; border-left: 1px solid var(--line-soft); color: var(--ink-soft); }
    .gateway-open svg { width: 13px; height: 13px; }
    .gateway-empty { min-height: 100%; display: grid; place-items: center; padding: 24px; color: var(--ink-soft); font: 9px/1.5 var(--mono-font); text-align: center; }
    .route-filter-empty { display: none; min-height: 100%; place-items: center; color: var(--ink-soft); font: 9px/1 var(--mono-font); }
    .route-filter-empty.visible { display: grid; }

    @media (max-width: 940px) {
      .app-sidebar { width: 154px; }
      .app-brand, .app-nav a { padding-inline: 13px; }
      .app-nav a { grid-template-columns: 16px minmax(0, 1fr); }
      .app-nav small { display: none; }
      .core-head { padding-inline: 13px; }
      .core-readout dl div { padding-left: 13px; }
      .app-topbar { left: 154px; }
      .app-page .container { left: 154px; }
      .gateway-route-row { grid-template-columns: 38px 44px minmax(150px, 1fr) 78px 80px minmax(130px, .8fr) 38px; }
    }
    @media (max-width: 720px) {
      .app-sidebar { inset: 0 0 auto; width: auto; height: 50px; display: grid; grid-template-columns: 116px minmax(0, 1fr); border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .app-brand { height: 49px; padding-inline: 12px; border-right: 1px solid var(--line-soft); border-bottom: 0; }
      .app-brand small, .core-readout { display: none; }
      .app-nav { grid-column: 2; grid-row: 1; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; }
      .app-nav a { min-height: 49px; grid-template-columns: 16px; justify-content: center; padding: 0; border-left: 0; border-bottom: 2px solid transparent; }
      .app-nav a.active { border-bottom-color: var(--blue); }
      .app-nav span { display: none; }
      .app-topbar { top: 50px; left: 0; height: 52px; padding-inline: 13px; }
      .app-location { display: none; }
      .gateway-search { width: auto; flex: 1; }
      .topbar-action { width: 32px; padding: 0; }
      .topbar-action span { display: none; }
      .app-page .container { top: 102px; left: 0; padding: 18px 13px 32px; }
      .gateway-dashboard { grid-template-rows: minmax(245px, 1fr) minmax(190px, .88fr); padding-bottom: 13px; }
      .board-readouts span { min-width: 62px; padding-inline: 8px; }
      .board-readouts span:first-child { display: none; }
      .directory-panel .board-header { min-height: 76px; flex-wrap: wrap; }
      .directory-filters { width: 100%; height: 30px; border-top: 1px solid var(--line-soft); }
      .directory-filter { flex: 1; }
      .gateway-route-row { min-height: 78px; grid-template-columns: 36px 42px minmax(0, 1fr) 36px; grid-template-rows: 47px 30px; }
      .route-number { grid-row: 1 / 3; }
      .route-kind, .route-policy { display: none; }
      .gateway-domain { grid-column: 2 / 4; grid-row: 2; align-self: stretch; display: flex; align-items: center; padding-left: 9px; border-top: 1px solid var(--line-soft); }
      .gateway-open { grid-column: 4; grid-row: 1 / 3; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat-card:nth-child(2) { border-right: 0; }
      .stat-card:nth-child(-n + 2) { border-bottom: 1px solid var(--line-soft); }
      .portal-grid { grid-template-columns: 1fr; gap: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
  <script>
    (function () {
      var theme = localStorage.getItem('theme') || 'system';
      if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    }());
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var next = current === 'dark' ? 'light' : current === 'light' ? (systemDark ? 'dark' : '') : 'dark';
      if (next) document.documentElement.setAttribute('data-theme', next);
      else document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', next || 'system');
    }
    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        container.setAttribute('aria-live', 'polite');
        document.body.appendChild(container);
      }
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + (type === 'error' ? 'error' : 'success');
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(function () { toast.remove(); }, 4000);
    }
    document.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var message = params.get('message');
      var error = params.get('error');
      if (message) showToast(message, 'success');
      if (error) showToast(error.replaceAll('_', ' '), 'error');
      if (message || error) {
        var cleanURL = new URL(window.location.href);
        cleanURL.searchParams.delete('message');
        cleanURL.searchParams.delete('error');
        history.replaceState(null, '', cleanURL);
      }
    });
  </script>
</head>
