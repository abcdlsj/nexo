{{template "head" .}}
<body>
  {{template "nav" .}}

  <main class="container">
    <section class="not-found">
      <div class="not-found-code" aria-hidden="true">404</div>
      <div>
        <div class="eyebrow">Not found</div>
        <h1>This route went nowhere.</h1>
        <p class="lede">Check the address or return to the control room.</p>
        <a href="/" class="btn btn-primary not-found-action">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to dashboard
        </a>
      </div>
    </section>
  </main>
  <style>
    .not-found { min-height: calc(100vh - 150px); display: grid; grid-template-columns: auto minmax(0, 440px); align-items: center; justify-content: center; gap: 2.5rem; }
    .not-found-code { padding: .2rem .8rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--coral); color: #111; box-shadow: var(--shadow); font-family: var(--display-font); font-size: 5rem; font-weight: 900; line-height: 1; }
    .not-found-action { margin-top: 1.2rem; }
    @media (max-width: 580px) { .not-found { grid-template-columns: 1fr; align-content: center; gap: 1.5rem; } .not-found-code { width: max-content; font-size: 3.75rem; } }
  </style>
</body>
</html>
