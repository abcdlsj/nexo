{{define "gateway_script"}}
<script>
  (function () {
    var search = document.getElementById('route-search');
    var rows = Array.prototype.slice.call(document.querySelectorAll('.gateway-route-row'));
    var leaves = Array.prototype.slice.call(document.querySelectorAll('.topology-service'));
    var filters = Array.prototype.slice.call(document.querySelectorAll('.directory-filter'));
    var empty = document.getElementById('route-filter-empty');
    var activeFilter = 'all';

    document.querySelectorAll('img[data-favicon]').forEach(function (image) {
      image.addEventListener('error', function () { image.hidden = true; }, { once: true });
    });

    function relativePoint(element, side, canvasBox) {
      var box = element.getBoundingClientRect();
      if (side === 'bottom') return { x: box.left + box.width / 2 - canvasBox.left, y: box.bottom - canvasBox.top };
      if (side === 'top') return { x: box.left + box.width / 2 - canvasBox.left, y: box.top - canvasBox.top };
      return { x: (side === 'right' ? box.right : box.left) - canvasBox.left, y: box.top + box.height / 2 - canvasBox.top };
    }

    function connectorPath(from, to) {
      var middle = from.x + (to.x - from.x) * .52;
      return 'M ' + from.x + ' ' + from.y + ' H ' + middle + ' V ' + to.y + ' H ' + to.x;
    }

    function path(className, d, id) {
      var element = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      element.setAttribute('class', className);
      element.setAttribute('d', d);
      if (id) element.setAttribute('id', id);
      return element;
    }

    function packet(pathId, index) {
      var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('class', 'topology-packet');
      circle.setAttribute('r', '3');
      var motion = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
      motion.setAttribute('dur', '1.8s');
      motion.setAttribute('begin', '-' + index + 's');
      motion.setAttribute('repeatCount', 'indefinite');
      var mpath = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
      mpath.setAttribute('href', '#' + pathId);
      motion.appendChild(mpath);
      circle.appendChild(motion);
      return circle;
    }

    function drawTopology() {
      var canvas = document.getElementById('topology-canvas');
      var svg = document.getElementById('topology-wires');
      if (!canvas || !svg) return;

      var canvasBox = canvas.getBoundingClientRect();
      svg.setAttribute('viewBox', '0 0 ' + Math.max(canvas.scrollWidth, canvas.clientWidth) + ' ' + Math.max(canvas.scrollHeight, canvas.clientHeight));
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      var edge = document.getElementById('edge-node');

      Array.prototype.forEach.call(document.querySelectorAll('.topology-row'), function (row, instanceIndex) {
        var node = row.querySelector('.core-node, .remote-node');
        if (!node) return;

        if (edge) {
          var ingress = connectorPath(relativePoint(edge, 'right', canvasBox), relativePoint(node, 'left', canvasBox));
          if (row.querySelector('.core-node')) {
            svg.appendChild(path('topology-wire-base', ingress));
            svg.appendChild(path('topology-wire-live', ingress, 'ingress-wire-live-' + instanceIndex));
            svg.appendChild(packet('ingress-wire-live-' + instanceIndex, 0));
          } else {
            svg.appendChild(path('topology-wire-base', ingress));
          }
        }

        Array.prototype.forEach.call(row.querySelectorAll('.topology-service'), function (leaf, routeIndex) {
          if (leaf.offsetParent === null) return;
          var d = connectorPath(relativePoint(node, 'right', canvasBox), relativePoint(leaf, 'left', canvasBox));
          var liveId = 'route-wire-live-' + instanceIndex + '-' + routeIndex;
          svg.appendChild(path('topology-wire-base', d));
          svg.appendChild(path('topology-wire-live', d, liveId));
          svg.appendChild(packet(liveId, (instanceIndex + routeIndex) % 5));
        });
      });
    }

    function applyFilter() {
      var query = search ? search.value.trim().toLocaleLowerCase() : '';
      var visible = 0;
      rows.forEach(function (row) {
        var match = (activeFilter === 'all' || row.dataset.policy === activeFilter) && (!query || row.dataset.search.toLocaleLowerCase().includes(query));
        row.hidden = !match;
        if (match) visible++;
      });
      leaves.forEach(function (leaf) {
        leaf.hidden = !((activeFilter === 'all' || leaf.dataset.policy === activeFilter) && (!query || leaf.dataset.search.toLocaleLowerCase().includes(query)));
      });
      if (empty) empty.classList.toggle('visible', visible === 0);
      requestAnimationFrame(drawTopology);
    }

    if (search) search.addEventListener('input', applyFilter);
    filters.forEach(function (filter) {
      filter.addEventListener('click', function () {
        activeFilter = filter.dataset.filter;
        filters.forEach(function (item) {
          var active = item === filter;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        applyFilter();
      });
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === '/' && search && document.activeElement !== search) { event.preventDefault(); search.focus(); }
      if (event.key === 'Escape' && search) { search.value = ''; search.blur(); applyFilter(); }
    });
    window.addEventListener('resize', drawTopology);
    if ('ResizeObserver' in window) {
      var canvas = document.getElementById('topology-canvas');
      if (canvas) new ResizeObserver(drawTopology).observe(canvas);
    }
    requestAnimationFrame(drawTopology);
  }());
</script>
{{end}}
