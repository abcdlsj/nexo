{{template "head" .}}
<body>
  <main class="login-shell">
    <section class="login-poster" aria-hidden="true">
      <div class="eyebrow">Nexo control plane</div>
      <div class="poster-mark">NX/<br>01</div>
      <p>Route sharply.<br>Ship securely.</p>
    </section>
    <section class="login-card">
      <div class="login-header">
        <svg class="login-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
          <rect x="2" y="3" width="20" height="14"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <div>
          <div class="eyebrow">Restricted access</div>
          <h1>Sign in</h1>
          <p class="login-subtitle">Authenticate to manage routes, certificates and traffic.</p>
        </div>
      </div>
      {{if .Error}}
      <div class="login-error" role="alert">
        <strong>Access denied.</strong> {{.Error}}
      </div>
      {{end}}
      <form method="POST" action="/login" class="login-form">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="redirect" value="{{.Redirect}}">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="admin">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary login-btn">Enter control plane <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>
  <style>
    .login-shell { width: min(980px, calc(100% - 2rem)); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: .9fr 1.1fr; align-items: center; gap: clamp(1rem, 5vw, 4rem); padding: 3rem 0; }
    .login-poster { min-height: 540px; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; border: 3px solid var(--border); background: var(--secondary); color: var(--secondary-foreground); box-shadow: 9px 9px 0 var(--border); transform: rotate(-1.5deg); }
    .poster-mark { font-family: var(--display-font); font-size: clamp(5rem, 14vw, 8.5rem); font-weight: 900; letter-spacing: -.09em; line-height: .7; }
    .login-poster p { font-family: var(--display-font); font-size: 2rem; font-weight: 900; line-height: .95; text-transform: uppercase; }
    .login-card { padding: clamp(1.35rem, 5vw, 2.5rem); border: 3px solid var(--border); background: var(--card); box-shadow: var(--shadow); }
    .login-header { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start; margin-bottom: 2rem; }
    .login-logo { width: 52px; height: 52px; padding: .45rem; border: 3px solid var(--border); background: var(--accent); color: var(--accent-foreground); }
    .login-header h1 { font-size: clamp(2.7rem, 8vw, 4.6rem); }
    .login-subtitle { max-width: 38ch; margin-top: .75rem; color: var(--muted-foreground); }
    .login-error { margin-bottom: 1.25rem; padding: .75rem; border: 3px solid var(--border); background: var(--destructive); color: var(--destructive-foreground); }
    .login-form { display: grid; gap: .8rem; }
    .login-form input { width: 100%; }
    .login-btn { width: 100%; margin-top: .4rem; }
    @media (max-width: 720px) { .login-shell { grid-template-columns: 1fr; padding: 1rem 0 2rem; } .login-poster { min-height: 180px; transform: none; } .poster-mark { font-size: 4.5rem; } .login-poster p { display: none; } }
  </style>
</body>
</html>
