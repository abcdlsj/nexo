{{template "head" .}}
<body>
  <main class="login-shell">
    <section class="login-poster" aria-label="Nexo">
      <div class="login-brand">
        {{template "mark" .}}
        <span>Nexo</span>
      </div>
      <div class="route-sketch" aria-hidden="true">
        <span>EDGE</span><b>01</b><i></i><span>NEXO</span><b>02</b><i></i><span>UPSTREAM</span><b>03</b>
      </div>
      <div class="login-poster-foot">
        <span class="status-dot"></span>
        Proxy control plane
      </div>
    </section>

    <section class="login-card">
      <header class="login-header">
        <div class="eyebrow">Restricted access</div>
        <h1>Sign in</h1>
      </header>
      {{if .Error}}
      <div class="login-error" role="alert">
        <strong>Access denied.</strong> {{.Error}}
      </div>
      {{end}}
      <form method="POST" action="/login" class="login-form">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="redirect" value="{{.Redirect}}">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="admin">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Password">
        </div>
        <button type="submit" class="btn btn-primary login-btn">
          Sign in
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </section>
  </main>
  <style>
    .login-shell { width: min(820px, calc(100% - 2rem)); min-height: calc(100vh - 5px); margin: 0 auto; display: grid; grid-template-columns: .85fr 1.15fr; align-items: center; padding: 2rem 0; }
    .login-poster { min-height: 430px; padding: 1.35rem; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid var(--border); border-right: 0; border-radius: var(--radius) 0 0 var(--radius); background: var(--yellow); color: #111; }
    .login-brand { display: flex; align-items: center; gap: .55rem; font-family: var(--display-font); font-size: 1.15rem; font-weight: 900; }
    .login-brand svg { width: 26px; height: 26px; }
    .route-sketch { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .35rem .7rem; font-family: var(--mono-font); font-size: .68rem; font-weight: 800; }
    .route-sketch span { padding: .45rem .55rem; border: 2px solid #111; border-radius: 2px; background: #fffefb; }
    .route-sketch b { font-size: .6rem; }
    .route-sketch i { grid-column: 1 / -1; width: 2px; height: 20px; margin-left: 1rem; background: #111; }
    .login-poster-foot { display: flex; align-items: center; gap: .45rem; font-family: var(--mono-font); font-size: .68rem; font-weight: 800; text-transform: uppercase; }
    .status-dot { width: 9px; height: 9px; border: 1.5px solid #111; background: var(--green); }
    .login-card { min-height: 470px; padding: 2rem; display: flex; flex-direction: column; justify-content: center; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: 4px 4px 0 var(--border); }
    .login-header { margin-bottom: 1.5rem; }
    .login-header h1 { font-size: 2.35rem; }
    .login-error { margin-bottom: 1rem; padding: .7rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--coral-soft); }
    .login-form { display: grid; gap: .65rem; }
    .login-form input { width: 100%; }
    .login-btn { width: 100%; margin-top: .25rem; }
    @media (max-width: 680px) {
      .login-shell { grid-template-columns: 1fr; align-content: center; padding: 1rem 0; }
      .login-poster { min-height: auto; flex-direction: row; align-items: center; gap: 1rem; padding: .85rem; border-right: 2px solid var(--border); border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; }
      .route-sketch { display: none; }
      .login-card { min-height: 390px; padding: 1.25rem; border-radius: 0 0 var(--radius) var(--radius); box-shadow: 3px 3px 0 var(--border); }
    }
  </style>
</body>
</html>
