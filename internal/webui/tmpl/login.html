{{template "head" .}}
<body class="login-page">
  <header class="login-topbar">
    <a class="login-identity" href="/" aria-label="Nexo">
      {{template "mark" .}}
      <b class="nexo-wordmark">NEXO</b>
    </a>
    <button type="button" class="theme-toggle" title="Toggle color theme" aria-label="Toggle color theme" onclick="toggleTheme()">
      <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
    </button>
  </header>

  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <header class="login-header">
        <h1 id="login-title">Sign in</h1>
      </header>

      {{if .Error}}
      <div class="login-error" role="alert">
        <strong>Access denied</strong>
        <span>{{.Error}}</span>
      </div>
      {{end}}

      <form method="POST" action="/login" class="login-form">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="redirect" value="{{.Redirect}}">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">Sign in</button>
      </form>
    </section>
  </main>

  <style>
    body.login-page { min-height: 100vh; min-height: 100dvh; background: var(--canvas); }
    .login-topbar { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(18px, 3vw, 34px); border-bottom: 1px solid var(--line-soft); background: var(--paper); }
    .login-identity { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
    .login-identity:hover { text-decoration: none; }
    .login-identity .nexo-mark { width: 24px; height: 24px; }
    .login-identity .mark-core { fill: var(--ink); }
    .login-identity .mark-upstream-a, .login-identity .mark-upstream-b { fill: var(--paper); }
    .login-topbar .theme-toggle { border: 0; background: transparent; }
    .login-topbar .theme-toggle:hover { border: 0; background: transparent; color: var(--blue); }

    .login-shell { min-height: calc(100vh - 58px); min-height: calc(100dvh - 58px); display: grid; place-items: center; padding: 40px 20px 72px; }
    .login-panel { position: relative; width: min(368px, 100%); padding-top: 24px; border-top: 1px solid var(--line-soft); }
    .login-panel::before { content: ""; position: absolute; top: -1px; left: 0; width: 28px; height: 2px; background: var(--blue); }
    .login-header { margin-bottom: 24px; }
    .login-header h1 { font-size: 24px; letter-spacing: -.02em; }
    .login-form { display: grid; gap: 18px; }
    .login-form .form-group { gap: 7px; margin: 0; }
    .login-form .form-group label { font-family: var(--body-font); font-size: 13px; font-weight: 650; text-transform: none; }
    .login-form input { width: 100%; min-height: 42px; }
    .login-btn { width: 100%; min-height: 38px; margin-top: 2px; font-family: var(--body-font); font-size: 13px; }
    .login-error { display: grid; gap: 2px; margin: -6px 0 20px; padding: 8px 0 8px 12px; border-left: 2px solid var(--coral); color: var(--ink-soft); font-size: 13px; }
    .login-error strong { color: var(--coral); font-weight: 650; }

    @media (max-width: 520px) {
      .login-topbar { height: 52px; padding-inline: 14px; }
      .login-shell { min-height: calc(100vh - 52px); min-height: calc(100dvh - 52px); place-items: start center; padding: 72px 18px 40px; }
    }
  </style>
</body>
</html>
